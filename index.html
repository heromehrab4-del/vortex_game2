<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex Net Game</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        
        body {
            /* پس‌زمینه تیره شبکه‌ای نئونی دقیقاً مطابق با تصویر ارسالی شما */
            background-color: #050b14;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px),
                radial-gradient(circle at center, rgba(0, 119, 255, 0.15) 0%, transparent 70%);
            background-size: 30px 30px, 30px 30px, 100% 100%;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            user-select: none;
        }

        /* هدر بالا شامل لوگو، سکه و انرژی دقیقاً مشابه عکس */
        .header-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 15px;
            width: 100%;
        }

        .brand-badge {
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid rgba(0, 255, 255, 0.4);
            color: #00ffff;
            padding: 4px 15px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 10px;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
        }

        .coins-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .coin-icon {
            width: 28px;
            height: 28px;
            background: gold;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #000;
            box-shadow: 0 0 10px gold;
        }

        .coins-count {
            font-size: 26px;
            font-weight: bold;
            color: #fff;
        }

        /* نوار انرژی دقیقاً مثل عکس */
        .energy-container {
            width: 85%;
            max-width: 350px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 8px;
            padding: 3px;
            position: relative;
        }

        .energy-bar {
            height: 12px;
            background: linear-gradient(90deg, #0077ff, #00ffff);
            border-radius: 5px;
            width: 100%;
            transition: width 0.2s ease;
        }

        .energy-text-row {
